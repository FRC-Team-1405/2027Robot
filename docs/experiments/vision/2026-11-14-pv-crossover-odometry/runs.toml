# Run table for the camera-setting crossover experiment (README.md next to this file).
#
# Fill in `log` (relative to logs/offseason/, no .wpilog) after each run. analyze.py reads the actual
# PhotonVision settings out of each log and reports any run whose log disagrees with `left` / `right`
# here, so a wrong setting shows up as a problem instead of a bad result.
#
#   python docs/experiments/vision/2026-11-14-pv-crossover-odometry/analyze.py
#
# Order below is a fixed random shuffle (seed 1405) so drift (battery, Pi temperature) hits both
# settings; keep it unless a run fails.

[cameras.left]
camera = "LeftCam"
pi = "LeftPi"

[cameras.right]
camera = "RightCam"
pi = "RightPi"

# What each setting name means. Decimate 2 and threads 8 on both (the competition pipeline);
# only the resolution (and so the results/s the Pi can reach) differs.
[settings.A]
mode = "800x600"          # logged as "800x600 MJPG @100"
decimate = 2
threads = 8

[settings.B]
mode = "1280x800"         # logged as "1280x800 MJPG @100"
decimate = 2
threads = 8

[[runs]]
id = "X1b"
kind = "X1"
left = "A"
right = "B"
log = ""

[[runs]]
id = "X1a"
kind = "X1"
left = "A"
right = "B"
log = ""

[[runs]]
id = "AA1"
kind = "AA"
left = "A"
right = "A"
log = ""

[[runs]]
id = "X2a"
kind = "X2"
left = "B"
right = "A"
log = ""

[[runs]]
id = "X1c"
kind = "X1"
left = "A"
right = "B"
log = ""

[[runs]]
id = "AA2"
kind = "AA"
left = "A"
right = "A"
log = ""

[[runs]]
id = "X2c"
kind = "X2"
left = "B"
right = "A"
log = ""

[[runs]]
id = "X2b"
kind = "X2"
left = "B"
right = "A"
log = ""

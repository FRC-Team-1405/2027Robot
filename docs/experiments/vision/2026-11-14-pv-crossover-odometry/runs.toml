# Run plan for the camera-setting crossover experiment (README.md next to this file).
#
# From tools/exprunner:
#   python -m exprunner check ../../docs/experiments/vision/2026-11-14-pv-crossover-odometry/runs.toml
#   python -m exprunner run   ../../docs/experiments/vision/2026-11-14-pv-crossover-odometry/runs.toml
#   python -m exprunner finish ../../docs/experiments/vision/2026-11-14-pv-crossover-odometry/runs.toml
# Then, from the repo root: python docs/experiments/vision/2026-11-14-pv-crossover-odometry/analyze.py
#
# Per run the runner sets both cameras in PhotonVision, checks the Pi publisher reports the new values,
# asks you to enable the auto, notices enable -> disable, fetches the log through LogBench and records it
# in manifest.json. `finish` puts the cameras back to what they were before the first run.
#
# Order below is a fixed random shuffle (seed 1405) so drift (battery, Pi temperature) hits both settings.

experiment = "VIS-2026-11-14-pv-crossover-odometry"
kind = "robot"
routine = "CircleFacingTag_Tag10"
cameras = ["LeftPi/LeftCam", "RightPi/RightCam"]

# Every setting starts from these: the competition pipeline (decimate 2, threads 8), exposure and gain
# the same on both cameras (the 11-10 logs: 80 and 25), Low Latency off.
[defaults]
decimate = 2
threads = 8
low_latency = false
exposure = 80.0
gain = 25

# A = the competition setting (about 101 results/s). B = the higher resolution (about 63 results/s).
[settings.A]
camera_mode = "800x600 MJPG @100"

[settings.B]
camera_mode = "1280x800 MJPG @100"

[[runs]]
id = "X1b"
what = "Left on A, Right on B"
use = { LeftCam = "A", RightCam = "B" }

[[runs]]
id = "X1a"
what = "Left on A, Right on B"
use = { LeftCam = "A", RightCam = "B" }

[[runs]]
id = "AA1"
what = "Both on A (the control: how different are the two cameras with nothing changed?)"
use = { all = "A" }

[[runs]]
id = "X2a"
what = "Left on B, Right on A"
use = { LeftCam = "B", RightCam = "A" }

[[runs]]
id = "X1c"
what = "Left on A, Right on B"
use = { LeftCam = "A", RightCam = "B" }

[[runs]]
id = "AA2"
what = "Both on A (the control)"
use = { all = "A" }

[[runs]]
id = "X2c"
what = "Left on B, Right on A"
use = { LeftCam = "B", RightCam = "A" }

[[runs]]
id = "X2b"
what = "Left on B, Right on A"
use = { LeftCam = "B", RightCam = "A" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpilog-utils"
version = "0.1.0"
description = "Shared, stdlib-only tools for reading and rewriting FRC .wpilog files"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["wpilog_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
